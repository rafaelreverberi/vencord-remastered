name: Validate Remastered installation build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  managed-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm testTsc
      - run: pnpm lint
      - run: pnpm build --disable-updater
      - run: pnpm buildWeb
