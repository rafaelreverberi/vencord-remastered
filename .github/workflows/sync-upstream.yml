name: Synchronize Vencord upstream
on:
  workflow_dispatch:
  schedule:
    - cron: '23 5 * * *'
permissions:
  contents: write
concurrency:
  group: remastered-upstream-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main
      - name: Fetch and merge in disposable checkout
        id: merge
        shell: bash
        run: |
          git config user.name 'Vencord Remastered sync'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream https://github.com/Vendicated/Vencord.git
          git fetch upstream main
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'changed=true' >> "$GITHUB_OUTPUT"
          if ! git merge --no-edit upstream/main; then
            mkdir -p sync-diagnostics
            git status --porcelain > sync-diagnostics/conflicts.txt
            git diff --binary > sync-diagnostics/conflict.diff
            git log -10 --oneline > sync-diagnostics/history.txt
            echo 'Upstream conflicts require manual resolution. Remastered main is unchanged.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - uses: pnpm/action-setup@v6
        if: steps.merge.outputs.changed == 'true'
      - uses: actions/setup-node@v6
        if: steps.merge.outputs.changed == 'true'
        with:
          node-version: 24
          cache: pnpm
      - name: Validate merged fork
        if: steps.merge.outputs.changed == 'true'
        run: |
          pnpm install --frozen-lockfile
          pnpm test
          pnpm buildWeb
          pnpm build --disable-updater
      - name: Publish validated merge without force
        if: steps.merge.outputs.changed == 'true'
        run: git push origin HEAD:main
      - name: Preserve conflict diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: upstream-sync-diagnostics
          path: sync-diagnostics/
          if-no-files-found: ignore
